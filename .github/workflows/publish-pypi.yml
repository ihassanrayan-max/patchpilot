name: publish-pypi

# Publishes sdist + wheel to PyPI using OIDC Trusted Publishing (no long-lived token).
# One-time PyPI setup (do this in the browser before the first run):
#   1. https://pypi.org/manage/account/publishing/ → Add a new pending publisher
#   2. PyPI project name: patchpilot  (create the project first if it does not exist)
#   3. Owner: ihassanrayan-max
#   4. Repository name: patchpilot
#   5. Workflow name: publish-pypi.yml
#   6. Environment name: (leave blank)
# After saving, re-run this workflow (workflow_dispatch) or cut the next v* tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish (e.g. v0.1.0)
        required: false
        default: v0.1.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

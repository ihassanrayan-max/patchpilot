[project]
name = "patchpilot"
version = "0.1.0"
description = "PatchPilot: ML system predicting 30-day CVE exploitation and ranking SBOM vulnerabilities, benchmarked against EPSS."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Apache-2.0" }
authors = [{ name = "PatchPilot Contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "duckdb>=1.1",
    "polars>=1.12",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "mlflow>=2.18",
    "great-expectations>=1.2",
    "prefect>=3.1",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "typer>=0.13",
    "cyclonedx-python-lib>=8.5",
    "packaging>=24.2",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[project.scripts]
patchpilot = "patchpilot.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".mlruns", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/patchpilot"]
exclude = ["^build/", "^dist/", "^\\.venv/", "^\\.mlruns/"]

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "shap.*",
    "mlflow.*",
    "great_expectations.*",
    "prefect.*",
    "cyclonedx.*",
    "cyclonedx_python_lib.*",
    "streamlit.*",
    "duckdb.*",
    "sklearn.*",
    "scikit_learn.*",
    "polars.*",
    "pyarrow.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers -ra"
testpaths = ["tests"]
markers = [
    "phase1: tests landing in Phase 1",
    "phase2: tests landing in Phase 2",
    "phase3: tests landing in Phase 3",
    "phase4: tests landing in Phase 4",
    "phase5: tests landing in Phase 5",
]
